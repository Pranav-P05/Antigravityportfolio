    // --- HTML5 CANVAS MATRIX-DOT GRID COMPONENT ---
    // Features:
    // 1. Perspective tilt based on smoothed mouse offset from center
    // 2. Interactive ripple waves dispersing outward on cursor hover & click
    // 3. Proximity neon illumination (dots brighten & swell to emerald/lime)
    // 4. Subtle ambient breathing wave so the grid remains dynamic even when idle
    // 5. Constellation micro-lines connecting dots near cursor
    const MatrixGridCanvas = ({ rippleMultiplier = 1, showConstellations = true }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        // Smoothed mouse state
        const mouse = {
          x: width / 2,
          y: height / 2,
          targetX: width / 2,
          targetY: height / 2,
          isHovering: false,
          speed: 0
        };

        let lastMousePos = { x: width / 2, y: height / 2 };

        // Shockwaves spawned by clicks or fast movements
        const shockwaves = [];

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.isHovering = true;

          // Calculate mouse velocity
          const distMoved = Math.hypot(mouse.targetX - lastMousePos.x, mouse.targetY - lastMousePos.y);
          mouse.speed = Math.min(distMoved, 30);
          lastMousePos = { x: mouse.targetX, y: mouse.targetY };

          // Spawn mini shockwave on rapid movement
          if (distMoved > 25 && shockwaves.length < 5) {
            shockwaves.push({
              x: mouse.targetX,
              y: mouse.targetY,
              radius: 5,
              maxRadius: 160 * rippleMultiplier,
              alpha: 0.6,
              speed: 4.5
            });
          }
        };

        const handleMouseLeave = () => {
          mouse.isHovering = false;
          mouse.targetX = width / 2;
          mouse.targetY = height / 2;
        };

        const handleClick = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const clickY = e.clientY - rect.top;
          
          shockwaves.push({
            x: clickX,
            y: clickY,
            radius: 5,
            maxRadius: 280 * rippleMultiplier,
            alpha: 0.9,
            speed: 6.5
          });
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('click', handleClick);

        // Grid Configuration
        const spacing = width < 640 ? 26 : 32;
        let time = 0;

        const render = () => {
          time += 0.022;

          // Smoothly interpolate mouse coordinates (LERP)
          mouse.x += (mouse.targetX - mouse.x) * 0.08;
          mouse.y += (mouse.targetY - mouse.y) * 0.08;

          ctx.clearRect(0, 0, width, height);

          // Update active shockwaves
          for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.radius += sw.speed;
            sw.alpha *= 0.96;
            if (sw.radius >= sw.maxRadius || sw.alpha <= 0.02) {
              shockwaves.splice(i, 1);
            }
          }

          const cols = Math.ceil(width / spacing) + 2;
          const rows = Math.ceil(height / spacing) + 2;

          // Parallax & Perspective tilt calculation
          const normX = (mouse.x - width / 2) / (width / 2);
          const normY = (mouse.y - height / 2) / (height / 2);
          const maxPerspectiveShift = 14;

          const points = [];

          for (let c = 0; c < cols; c++) {
            for (let r = 0; r < rows; r++) {
              const baseGridX = (c - 1) * spacing;
              const baseGridY = (r - 1) * spacing;

              // Perspective 3D tilt offset
              const depthFactor = (baseGridY / height) * 0.8 + 0.6;
              const perspX = baseGridX + normX * maxPerspectiveShift * depthFactor;
              const perspY = baseGridY + normY * maxPerspectiveShift * (baseGridX / width * 0.5 + 0.7);

              // Idle organic sine breathing
              const ambientRipple = Math.sin(c * 0.28 + time) * Math.cos(r * 0.28 + time * 0.8) * 2.5;

              // Interactive mouse ripple displacement
              const distToMouse = Math.hypot(perspX - mouse.x, perspY - mouse.y);
              const interactionRadius = 180 * rippleMultiplier;
              let dispX = 0;
              let dispY = 0;
              let proximityFactor = 0;

              if (distToMouse < interactionRadius) {
                proximityFactor = 1 - distToMouse / interactionRadius;
                // Elastic radial push away from mouse
                const angle = Math.atan2(perspY - mouse.y, perspX - mouse.x);
                const pushDist = Math.sin(proximityFactor * Math.PI) * 12 * rippleMultiplier;
                dispX = Math.cos(angle) * pushDist;
                dispY = Math.sin(angle) * pushDist;
              }

              // Apply shockwaves
              let shockwaveEffect = 0;
              for (let k = 0; k < shockwaves.length; k++) {
                const sw = shockwaves[k];
                const d = Math.hypot(perspX - sw.x, perspY - sw.y);
                const ringDist = Math.abs(d - sw.radius);
                if (ringDist < 40) {
                  const ringFactor = (1 - ringDist / 40) * sw.alpha;
                  shockwaveEffect += ringFactor;
                  const angle = Math.atan2(perspY - sw.y, perspX - sw.x);
                  dispX += Math.cos(angle) * ringFactor * 16;
                  dispY += Math.sin(angle) * ringFactor * 16;
                }
              }

              const finalX = perspX + dispX;
              const finalY = perspY + dispY + ambientRipple;

              // Dot size and color interpolation based on proximity & shockwaves
              const intensity = Math.min(1, proximityFactor * 1.2 + shockwaveEffect);
              const dotRadius = 1.1 + intensity * 2.2;

              let dotColor;
              if (intensity > 0.6) {
                // Bright lime-emerald cyber highlight
                dotColor = `rgba(163, 230, 53, ${0.4 + intensity * 0.55})`;
              } else if (intensity > 0.15) {
                // Crisp neon emerald
                dotColor = `rgba(16, 185, 129, ${0.25 + intensity * 0.6})`;
              } else {
                // Subtle matte carbon-emerald background dot
                dotColor = 'rgba(16, 185, 129, 0.14)';
              }

              // Draw Dot
              ctx.beginPath();
              ctx.arc(finalX, finalY, dotRadius, 0, Math.PI * 2);
              ctx.fillStyle = dotColor;

              // Add subtle glow only to excited dots for 60fps performance
              if (intensity > 0.4) {
                ctx.shadowColor = intensity > 0.7 ? '#a3e635' : '#10b981';
                ctx.shadowBlur = 8 * intensity;
              } else {
                ctx.shadowBlur = 0;
              }

              ctx.fill();

              // Collect near-mouse points for constellation micro-mesh
              if (showConstellations && distToMouse < 90 && intensity > 0.3) {
                points.push({ x: finalX, y: finalY, intensity });
              }
            }
          }

          // Draw subtle interactive constellation micro-lines
          if (showConstellations && points.length > 0) {
            ctx.shadowBlur = 0;
            for (let i = 0; i < points.length; i++) {
              for (let j = i + 1; j < points.length; j++) {
                const p1 = points[i];
                const p2 = points[j];
                const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                if (d < 50) {
                  ctx.beginPath();
                  ctx.moveTo(p1.x, p1.y);
                  ctx.lineTo(p2.x, p2.y);
                  const lineAlpha = (1 - d / 50) * Math.min(p1.intensity, p2.intensity) * 0.35;
                  ctx.strokeStyle = `rgba(16, 185, 129, ${lineAlpha})`;
                  ctx.lineWidth = 0.8;
                  ctx.stroke();
                }
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('click', handleClick);
        };
      }, [rippleMultiplier, showConstellations]);

      return (
        <canvas
          ref={canvasRef}
          id="matrix-dot-grid"
          className="fixed inset-0 pointer-events-none z-0"
          style={{ opacity: 0.95 }}
          aria-hidden="true"
        />
      );
    };

        >

                  : 'bg-carbon-100/70 backdrop-blur-md border border-carbon-border/70 py-3.5 px-4 sm:px-6'

                  </div>

        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const normX = x / rect.width;
        const normY = y / rect.height;

        // Subtle 3D tilt: -14 to +14 deg
        const rotateX = (0.5 - normY) * 16;
        const rotateY = (normX - 0.5) * 16;

        setTilt({ x: rotateX, y: rotateY });
        setShine({ x, y });
      };

      const handleMouseEnter = () => setIsHovered(true);
      const handleMouseLeave = () => {
        setIsHovered(false);
        setTilt({ x: 0, y: 0 });

    const MagneticButton = ({ children, className = "", onClick, href, target, rel, ...props }) => {
      const btnRef = useRef(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        if (!btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const x = e.clientX - (rect.left + rect.width / 2);
        const y = e.clientY - (rect.top + rect.height / 2);
        setOffset({ x: x * 0.22, y: y * 0.22 });
      };

      const handleMouseLeave = () => {
        setOffset({ x: 0, y: 0 });
      };

      const Component = href ? 'a' : 'button';

      return (
        <Component
          ref={btnRef}
          href={href}
          target={target}
          rel={rel}
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `translate3d(${offset.x}px, ${offset.y}px, 0)`,
            transition: 'transform 0.15s ease-out'
          }}
          className={className}
          {...props}
        >
          {children}
        </Component>
      );
    };

    // --- CUSTOM CURSOR FOLLOWER & TRAILING SPARK (EASTER EGG) ---
    const CursorSparkFollower = () => {
      const [trailingPos, setTrailingPos] = useState({ x: -100, y: -100 });
      const [isVisible, setIsVisible] = useState(false);
      const [sparks, setSparks] = useState([]);

      useEffect(() => {
        let mouseX = -100;
        let mouseY = -100;
        let chaseX = -100;
        let chaseY = -100;
        let animId;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          setIsVisible(true);
        };

        const onMouseLeave = () => {
          setIsVisible(false);
        };

        const onClick = (e) => {
          const newSparks = Array.from({ length: 6 }).map((_, i) => ({
            id: Date.now() + i,
            x: e.clientX,
            y: e.clientY,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            alpha: 1,
            size: Math.random() * 3 + 2
          }));
          setSparks((prev) => [...prev.slice(-12), ...newSparks]);
        };

        const loop = () => {
          chaseX += (mouseX - chaseX) * 0.18;
          chaseY += (mouseY - chaseY) * 0.18;
          setTrailingPos({ x: chaseX, y: chaseY });

          setSparks((prev) =>
            prev
              .map((s) => ({
                ...s,
                x: s.x + s.vx,
                y: s.y + s.vy,
                alpha: s.alpha * 0.91,
                size: s.size * 0.96
              }))
              .filter((s) => s.alpha > 0.05)
          );

          animId = requestAnimationFrame(loop);
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        document.addEventListener('mouseleave', onMouseLeave);
        window.addEventListener('click', onClick);
        animId = requestAnimationFrame(loop);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onMouseLeave);
          window.removeEventListener('click', onClick);
        };
      }, []);

      if (!isVisible) return null;

      return (
        <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden hidden md:block">
          <div
            className="fixed w-10 h-10 rounded-full bg-emerald-500/20 blur-md pointer-events-none -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300"
            style={{
              left: `${trailingPos.x}px`,
              top: `${trailingPos.y}px`
            }}
          />
          <div
            className="fixed w-2 h-2 rounded-full bg-lime-neon shadow-[0_0_10px_#a3e635] pointer-events-none -translate-x-1/2 -translate-y-1/2"
            style={{
              left: `${trailingPos.x}px`,
              top: `${trailingPos.y}px`
            }}
          />
          {sparks.map((s) => (
            <div
              key={s.id}
              className="fixed rounded-full bg-emerald-neon shadow-[0_0_8px_#10b981] pointer-events-none -translate-x-1/2 -translate-y-1/2"
              style={{
                left: `${s.x}px`,
                top: `${s.y}px`,
                width: `${s.size}px`,
                height: `${s.size}px`,
                opacity: s.alpha
              }}
            />
          ))}
        </div>
      );
    };
